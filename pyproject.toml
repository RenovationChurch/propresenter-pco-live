[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcosync"
version = "0.1.0"
description = "Keep Planning Center Services LIVE on the same item as ProPresenter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pcosync = "pcosync.cli:main"

[tool.setuptools]
packages = ["pcosync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
